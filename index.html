<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <script>
      // Apply the saved theme before content appears, defaulting to light mode.
      (() => {
        let appearance = 'light'
        try {
          if (localStorage.getItem('query-builder.theme') === 'dark') appearance = 'dark'
        } catch {
          // Storage is optional; keep light mode when unavailable.
        }
        document.documentElement.dataset.theme = appearance
      })()
    </script>
    <link rel="stylesheet" href="/src/styles/theme.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400&display=swap" rel="stylesheet">
    <title>Query Builder</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
